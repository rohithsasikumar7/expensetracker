<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <h1>Finance Dashboard</h1>
    </nav>

    <div class="container">
        <!-- Top Section: Balances -->
        <div class="dashboard-top">
            <div class="summary-card balance">
                <h3>Total Balance</h3>
                <h2 id="balance">$0.00</h2>
            </div>
            <div class="summary-card income">
                <h3>Total Income</h3>
                <h2 id="income-total">+$0.00</h2>
            </div>
            <div class="summary-card expense">
                <h3>Total Expenses</h3>
                <h2 id="expense-total">-$0.00</h2>
            </div>
        </div>

        <!-- Main Content Area: Side-by-Side Layout -->
        <div class="main-content">
            
            <!-- Left Side: Add Transaction Form -->
            <div class="left-panel panel">
                <h3>Add New Transaction</h3>
                <form id="transaction-form">
                    <div class="form-control">
                        <label for="text">Transaction Name</label>
                        <input type="text" id="text" placeholder="e.g., Salary, Groceries, Rent..." required>
                    </div>
                    
                    <div class="form-control">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-control">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" placeholder="Enter amount..." required min="0.01" step="0.01">
                    </div>
                    
                    <button class="btn">Add Transaction</button>
                </form>
            </div>

            <!-- Right Side: Transaction History -->
            <div class="right-panel panel">
                <h3>Transaction History</h3>
                <div class="history-container">
                    <ul id="list" class="list">
                        <!-- JavaScript will populate items here -->
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
